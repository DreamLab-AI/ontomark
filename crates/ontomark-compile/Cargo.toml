[package]
name = "ontomark-compile"
description = "Compile Markdown ontology vaults to RDF 1.1 Turtle, JSON-LD 1.1, SHACL, NGG1 graph tiers and page APIs under a versioned profile"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords = ["ontology", "owl", "rdf", "obsidian", "shacl"]
categories = ["compilers", "science"]

[dependencies]
serde = { workspace = true }
# preserve_order: every JSON artefact's key order is part of the byte contract.
serde_json = { workspace = true, features = ["preserve_order"] }
serde_yaml = "0.9"
indexmap = { workspace = true }
thiserror = { workspace = true }
anyhow = "1"
regex = "1"
walkdir = "2"
sha2 = "0.10"
hex = "0.4"
time = { version = "0.3", features = ["formatting", "parsing", "macros", "serde"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
