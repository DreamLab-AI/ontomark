# vault.toml — the visionGraph corpus manifest.
#
# One vault, two roles: `knowledge` is the governed OKF bundle that Loom,
# VisionClaw and narrativegoldmine.com serve; `working` is the curator's space
# that proposals are generated from. `vault` (VisionClaw crates/vault) reads
# this file to know what to validate, build and publish.
#
# Governed by PRD-sovereign-corpus (VisionFlow) and VisionClaw ADR-2112.
# Contracts: C1 (ontology/vocabulary.yaml), C3 (build bundle).

[vault]
name = "visionGraph"
version = "2.0.0"                 # corpus format version; see VAULT-corpus-format.md
repository = "jjohare/visionGraph"
generation_id = "visionGraph@<sha>"   # local commit sha + content digest (PRD Q8)

[vocabulary]
path = "ontology/vocabulary.yaml"
version = 1
namespace = "urn:ngm:class:"
context = "https://narrativegoldmine.com/context/v1.jsonld"

# ---------------------------------------------------------------------------
# Roles
# ---------------------------------------------------------------------------

[roles.knowledge]
role = "governed"
root = "knowledge"                        # pages sit at the vault root (2026-10-16; no pages/ folder)
index = "knowledge/index.md"              # OKF §8 index, generated by `vault build`, committed
obsidian = "knowledge/.obsidian"
types = ["Class", "Property", "Individual"]
unknown_keys = "fail"                     # OKF v0.2 strict
required_keys = ["type", "title", "resource", "public", "status", "generated"]
public_gate = "public"                    # frontmatter key; fail-closed
publishable = true
reasoned = true                           # Whelk EL++ closure
excluded = [".deleted/"]

[roles.working]
role = "curator"
root = "working"                          # pages sit at the vault root (2026-10-16; no pages/ folder)
obsidian = "working/.obsidian"
types = ["Note", "Episode", "Transcript", "Draft Concept", "Journal", "Canvas"]
unknown_keys = "allow"                    # OKF v0.2 §4.1
required_keys = ["type", "title"]
publishable = false
reasoned = false
proposal_source = { type = "Draft Concept", status = "draft" }

# ---------------------------------------------------------------------------
# Assets — one symlink, deliberately kept
# ---------------------------------------------------------------------------

[assets]
# knowledge/assets is a symlink into working/assets so a page elevated from the
# working vault keeps working image and PDF links without a copy. `vault
# validate` follows it for link integrity; `vault build` resolves it and Quartz
# copies through it. The symlink is the single shared binary store; duplicating
# it was tried and produced two divergent 900 MB trees.
knowledge = "knowledge/assets"
working = "working/assets"
symlinked = true
link_form = "assets/<file>"               # vault-root-relative, never ../assets/

# ---------------------------------------------------------------------------
# Build targets — contract C3. `vault build --out <dir>` writes all of these.
# ---------------------------------------------------------------------------

[build]
out = "build"
vault = "knowledge"
public_only = true
emit_domain_disjointness = false          # retired 2026-08-15; the lattice is by design
reasoner = "whelk"
profile = "EL"

[build.artifacts]
ontology          = "data/ontology.ttl"                 # asserted
ontology_inferred = "data/ontology-inferred.ttl"        # Whelk EL++ closure
scaffold_index    = "data/scaffold-index.json"          # v1 RawIndex; byte-parity golden
prose_index       = "data/prose-index.json"
rvdb              = "data/ontology-corpus.rvdb"
rvdb_sidecar      = "data/ontology-corpus.rvdb.generation.json"
search_index      = "api/search-index.json"
page_api          = "api/pages/<slug>.json"
census            = "api/census.json"
validation_report = "api/validation-report.json"
jsonld_context    = "context/v1.jsonld"
okf_bundle        = "okf/"
generation        = ".generation.json"

[build.embedding]
model = "bge-small-en-v1.5"
dimensions = 384
endpoint = "http://192.168.2.132:9997"    # xinference on machinelearn

[build.generation]
# Written to .generation.json; Loom's /health and manifest surface it (PRD Q8).
fields = ["id", "commit", "content_digest", "generated_at", "class_count",
          "page_count", "vocabulary_version", "stale_after", "artifacts"]

# ---------------------------------------------------------------------------
# Policy
# ---------------------------------------------------------------------------

[policy]
# A PatchProposal expires after 14 days; on expiry the PROPOSAL reverts to
# draft and is re-surfaced by the escalated-on-age cron. The page is untouched
# (PRD Q7).
proposal_stale_after = "14d"

# Content pages do not go stale on a timer. Demotion is proposed by a detected
# conflict, never by the calendar, and always requires a human 31403 (PRD Q6).
content_stale_after = ""

schema_tier_floor = "High"                # a Schema-level proposal is always tier High
signers = 1                               # single human signer; quorum deferred
auto_revert = true                        # exposure-level changes revert on a failed paired eval

[policy.blockers]
# Automatic blockers. A proposal carrying any of these is never posted and is
# never approvable.
values = ["WHELK_INCONSISTENCY", "SUBCLASS_CYCLE", "RELATION_CONTRADICTION",
          "VOCABULARY_VIOLATION", "RESOURCE_COLLISION", "RESOURCE_MUTATED"]

[policy.levels]
# What each proposal level requires. Exposure-level changes live in Loom, not
# here, and self-evolve under ADR-140 D6's paired-eval gate.
content   = { signed = true,  tier = "operator" }
schema    = { signed = true,  tier = "High" }
demotion  = { signed = true,  tier = "operator" }
exposure  = { signed = false, tier = "none", ledgered = true }

# ---------------------------------------------------------------------------
# Publish — Quartz v4 renders narrativegoldmine.com from knowledge/ (PRD Q13)
# ---------------------------------------------------------------------------

[publish]
site = "narrativegoldmine.com"
generator = "quartz"
generator_version = "4"
config = "quartz/"
content = "knowledge/"                    # ExplicitPublish; working/ is excluded
gate_key = "public"                       # a page publishes iff `public: true`
static = "quartz/static"                  # `vault build` writes its artefacts here
workflow = ".github/workflows/publish.yml"
trigger = "owner"                         # agents never push; the owner triggers

# ---------------------------------------------------------------------------
# Consumers — who reads this build, for the acceptance checks in PRD §5
# ---------------------------------------------------------------------------

[consumers.loom]
reads = "build/"
identity = "visionGraph@<sha>"
reload = "timer"                          # enabled after the first clean promotion

[consumers.visionclaw]
source = "LocalDirectory"
mount = "multi-agent-docker_workspace"
readonly = true
reads = "knowledge"

[consumers.obsidian]
plugins = "core-only"                     # Bases, types.json, Templater, Canvas, obsidian-git
config_committed = true
