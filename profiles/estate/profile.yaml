frontmatter:
  # The vault roles of vault.toml: which page types each vault admits, which
  # keys a page must carry, and whether an undeclared key is an error.
  roles:
    knowledge:
      types: ["Class", "Property", "Individual"]
      required_keys: ["type", "title", "resource", "public", "status", "generated"]
      unknown_keys: fail
      publishable: true
      reasoned: true
    working:
      types: ["Note", "Episode", "Transcript", "Draft Concept", "Journal", "Canvas"]
      required_keys: ["type", "title"]
      unknown_keys: allow
      publishable: false
      reasoned: false
  # The fail-closed publication flag: only a literal boolean true publishes.
  public_gate: public
attribution:
  # ontology/attribution.yaml: generators keyed by did:nostr (public keys only).
  roster: ontology/attribution.yaml
  # generated.by actor grammar.
  actors: ["human:<npub>", "agent:<label>/<version>", "process:<name>/<version>"]
governance:
  # Nostr event kinds of the governance loop (posted by VisionClaw's adapter).
  kinds:
    panel: 31400
    proposal: 31402
# layout: the vaults are ordinary Obsidian vaults with pages at the vault root
# (2026-10-16; the Logseq-era pages/ folder is gone). The defaults — the
# knowledge vault at knowledge/, the working vault at working/, and the built-in
# excluded folders templates, bases, assets, journals — are what the estate
# needs, so no `layout:` block is set here; add `layout: {knowledge: …,
# working: …, excluded: [...]}` to change it (ADR-OM-008).
# generation: every estate bundle is `visionGraph@<sha>`; the consumers (Loom,
# VisionClaw, agentbox) promote against that spelling, so the prefix is pinned
# rather than taken from the checkout's directory name (ADR-OM-008).
generation:
  prefix: visionGraph
publication:
  # EXP-04: a link that resolves to a page that is not public is removed from the
  # staged publish/ Markdown and the api/markdown mirror, never emitted with the
  # private title. `ontomark build --no-redact-private-links` turns it off for
  # byte-parity runs against the legacy build only.
  redact_private_links: true
