# The DreamLab estate profile: the corpus rules of visionGraph as versioned data.
# Every value here was lifted from VisionClaw `crates/vault` at 1044b0722
# (tag ontomark-census-baseline); the golden suite proves the compiler emits the
# same bytes with it. Order is significant wherever a list is a numbering
# (domains, categories): positions are published identities, append-only.
id: estate
version: "1.0.0"
iris:
  # Authored identities (frontmatter `resource:` / `page_resource:`), kept byte for byte.
  class_namespace: "urn:ngm:class:"
  individual_namespace: "urn:ngm:individual:"
  page_namespace: "urn:visionflow:page:"
  # Published projections of those identities.
  public_class_base: "https://narrativegoldmine.com/class/"
  public_individual_base: "https://narrativegoldmine.com/individual/"
  public_page_base: "https://narrativegoldmine.com/page/"
  # Historical namespaces older pages still cite; they publish under the same bases.
  legacy_projections:
    - {prefix: "urn:visionflow:owl:class:", base: "https://narrativegoldmine.com/class/"}
    - {prefix: "urn:visionflow:linked:", base: "https://narrativegoldmine.com/linked/"}
  vocabulary_prefix: "vc"
  class_prefix: "ngm"
  individual_prefix: "ngmi"
  vocabulary_namespace: "https://narrativegoldmine.com/ns/v1#"
  ns_base: "https://narrativegoldmine.com/ns"
  ontology_iri: "https://narrativegoldmine.com/ontology"
  ontology_label: "NarrativeGoldmine Ontology"
  inferred_ontology_iri: "https://narrativegoldmine.com/ontology/inferred"
  inferred_label: "NarrativeGoldmine Inferred Axioms"
  version_info: "3.1.0"
dataset:
  pipeline_version: "ng-1.0.0"
  attributed_to: "did:nostr:d598abc6edefc37e10523aec4c00f8d9674a93791aa34a1db03bfa9b60b9f246"
  attributed_label: "DreamLab AI"
  nature: "synthetic-ai-generated-human-directed"
  kind: "synthetic"
  authors: ["Dr John O'Hare", "LCR Swarm"]
  bundle_title: "NarrativeGoldmine Knowledge Bundle"
  description: "Mostly AI-generated synthetic content, produced under human direction, by design — this corpus exists to exercise and demonstrate the VisionFlow pipeline and VisionClaw engine on a medium-scale ontology (~8.1k classes, ~100k relations). Provenance (did:nostr, generatedAtTime, URNs) attests traceable generation under human direction, not human authorship."
