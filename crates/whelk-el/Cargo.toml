[package]
name = "whelk-el"
description = "OWL 2 EL reasoner derived from Whelk and whelk-rs; portable, no I/O, optional parallelism"
version = "0.1.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "README.md"
keywords = ["owl", "ontology", "reasoner", "el", "wasm"]
categories = ["science", "wasm"]

[features]
default = []
# Saturate independent components on the rayon pool (classify_parallel).
parallel = ["dep:rayon"]
# Convert horned-owl components into ElAxioms. horned-owl does not build for
# wasm32-unknown-unknown, so this is a native-only adapter.
horned-owl = ["dep:horned-owl"]

[dependencies]
im = "15.1"
rayon = { version = "1.10", optional = true }
horned-owl = { version = "1.2", optional = true, default-features = false }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "=0.3.77" # matches the baked wasm-bindgen-test-runner 0.2.127

[lints]
workspace = true
