[workspace]
resolver = "2"
members = [
    "crates/ontomark-model",
    "crates/ontomark-parse",
    "crates/ontomark-reason",
    "crates/ontomark-compile",
    "crates/ontomark-ngg1",
    "crates/ontomark-wasm",
    "crates/ontomark-cli",
    "crates/whelk-el",
    "profiles/estate",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/DreamLab-AI/ontomark"
authors = ["DreamLab AI"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
indexmap = { version = "2", features = ["serde"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
