[package]
name = "ontomark-compile"
description = "Compile Markdown ontology vaults to RDF 1.1 Turtle, JSON-LD 1.1, SHACL, NGG1 graph tiers and page APIs under a versioned profile"
version = "0.1.3"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "README.md"
keywords = ["ontology", "owl", "rdf", "obsidian", "shacl"]
categories = ["compilers", "science"]

[features]
default = ["whelk-el"]
# The OWL 2 EL classifier the build and the gate reason with.
whelk-el = ["dep:ontomark-reason"]
# Pure, profile-injected projection from the normative typed model, including
# the shared supported-profile classifier. No filesystem reads are performed.
model-projection = ["dep:ontomark-model", "dep:ontomark-reason"]

[dependencies]
ontomark-model = { workspace = true, optional = true }
ontomark-reason = { path = "../ontomark-reason", version = "0.1.1", optional = true }
ontomark-ngg1 = { path = "../ontomark-ngg1", version = "0.1.0" }
serde = { workspace = true }
# preserve_order: every JSON artefact's key order is part of the byte contract.
serde_json = { workspace = true, features = ["preserve_order"] }
serde_yaml = "0.9"
indexmap = { workspace = true }
thiserror = { workspace = true }
anyhow = "1"
regex = "1"
walkdir = "2"
sha2 = "0.10"
hex = "0.4"
time = { version = "0.3", features = ["formatting", "parsing", "macros", "serde"] }

[dev-dependencies]
# Independent pre-migration backend oracle for shared-classifier parity tests.
whelk-el = { path = "../whelk-el", version = "0.1.1" }
ontomark-parse = { workspace = true }
tempfile = "3"
# Independent JSON-LD 1.1 parser (oxigraph project) that checks the JSON-LD
# serialisation against the Turtle in the tests (with oxttl and oxrdf below).
oxjsonld = "0.2"
# W3C conformance and writer round-trip tests (conformance/w3c).
oxttl = "0.2.4"
oxrdf = { version = "0.3.4", features = ["rdfc-10"] }
oxrdfxml = "0.2.4"
oxiri = "0.3.1"

[lints]
workspace = true

# These integration tests exercise the optional concrete classifier.

[[test]]
name = "probe_consistency"
required-features = ["whelk-el"]

[[test]]
name = "publish_gate"
required-features = ["whelk-el"]

[[test]]
name = "whelk_scaling"
required-features = ["whelk-el"]

[[test]]
name = "model_projection"
required-features = ["model-projection"]
