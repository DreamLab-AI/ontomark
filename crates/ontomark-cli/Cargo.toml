[package]
name = "ontomark"
description = "Markdown ontology vaults to standard artefacts: build, validate, gate, conflicts, find, retrieve, tree, guarded edits and migrations for Obsidian vaults and estate repositories"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage = "https://github.com/DreamLab-AI/ontomark"
authors.workspace = true
readme = "README.md"
keywords = ["ontology", "owl", "obsidian", "rdf", "cli"]
categories = ["command-line-utilities", "science"]

[[bin]]
name = "ontomark"
path = "src/main.rs"

[features]
default = []
## `create --suggest`: the opt-in Jev option (advisory domain/type/parent
## suggestions). Off by default; the default build has none of that code.
## (`ontomark-jev` itself is always linked: `ingest` reuses its endpoint policy.)
jev = []

[dependencies]
ontomark-jev = { path = "../ontomark-jev", version = "0.6.1", features = ["http"] }
ontomark-ingest = { workspace = true }
ontomark-model = { workspace = true }
ontomark-parse = { workspace = true }
ontomark-source = { path = "../ontomark-source", version = "0.1.0", features = ["http"] }
ontomark-compile = { path = "../ontomark-compile", version = "0.6.1" }
ontomark-profile-estate = { path = "../../profiles/estate", version = "0.6.1" }
anyhow = "1"
clap = { version = "4.5", features = ["derive", "env"] }
serde_json = { workspace = true, features = ["preserve_order"] }
ureq = { version = "2", features = ["json"] }

[lints]
workspace = true

[dev-dependencies]
tempfile = "3"
